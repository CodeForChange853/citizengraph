# Phrase templates for the query shapes added in session 5b (see core1/templates.py NEW_SHAPES),
# and the wording of the new target kinds (offices, agencies, documents).
#
# Written by us by hand. No LLM API output, nothing from eval/heldout/ (never read). Questions
# only: no answer text from the charters. The document words are phrases that really occur in
# requirement text and the agencies are Agency nodes of the seed (tests check both); an office,
# agency or document named in a question is an input to the query, not an answer.
#
# NEEDS-NATIVE-REVIEW: every `fil` and `mixed` string in this file is unverified Filipino or
# Taglish (CLAUDE.md rule 8). The full list is in docs/training_notes.md.
#
# Same syntax as phrasebook.yaml: <a|b> picks one alternative; a family is a list of paraphrases
# that always stays in ONE split. Placeholders by target kind: {service}, {service2}, {office},
# {agency}, {document}; a template uses exactly the placeholders its shape needs.
#
# Two shapes are held out of training on purpose (training/generate_dataset.py HELD_OUT_SHAPES):
# office_who and compare_time. All their families go to test_unseen_shape.

version: 1

offices:
  bplo:
    en: ["BPLO", "the business permits office", "the business permits and licensing office"]
    fil: ["BPLO", "opisina ng business permits", "tanggapan ng business permits at licensing"]
  lcro:
    en: ["LCRO", "the civil registry", "the local civil registry office"]
    fil: ["LCRO", "civil registry", "tanggapan ng civil registry"]
  cho:
    en: ["CHO", "the city health office", "the health office"]
    fil: ["CHO", "city health office", "opisina ng kalusugan ng lungsod"]
  cswdo:
    en: ["CSWDO", "the social welfare office", "the city social welfare office"]
    fil: ["CSWDO", "social welfare office", "tanggapan ng social welfare"]

agencies:
  city-treasurers-office:
    en: ["the city treasurer's office", "the treasurer's office"]
    fil: ["city treasurer's office", "opisina ng city treasurer"]
  civil-registry-office:
    en: ["the civil registry office", "the civil registry"]
    fil: ["civil registry office", "opisina ng civil registry"]
  civil-registry-office-or-notary-public:
    en: ["the civil registry office or a notary public", "civil registry or notary"]
    fil: ["civil registry office o notary public", "civil registry o notaryo"]
  philippine-statistics-authority-lcr-calbayog-thru-breqs:
    en: ["PSA", "the Philippine Statistics Authority"]
    fil: ["PSA", "Philippine Statistics Authority"]
  department-of-trade-and-industry-dti:
    en: ["DTI", "the Department of Trade and Industry"]
    fil: ["DTI", "Kagawaran ng Kalakalan at Industriya"]
  security-and-exchange-commission-sec:
    en: ["SEC", "the SEC"]
    fil: ["SEC", "ang SEC"]
  bureau-of-fire-protection-bfp:
    en: ["BFP", "the Bureau of Fire Protection"]
    fil: ["BFP", "Bureau of Fire Protection"]
  city-health-office-cho:
    en: ["the City Health Office", "CHO"]
    fil: ["City Health Office", "CHO"]

# key = the words that must occur (lowercase) inside at least one requirement text; it is also the
# `$doc` parameter the query gets.
documents:
  cedula:
    en: ["cedula", "community tax certificate"]
    fil: ["cedula", "sedula"]
  proof of payment:
    en: ["proof of payment", "payment receipt"]
    fil: ["patunay ng bayad", "resibo ng bayad"]
  marriage certificate:
    en: ["marriage certificate", "a marriage certificate"]
    fil: ["marriage certificate", "sertipiko ng kasal"]
  affidavit:
    en: ["an affidavit", "a sworn affidavit"]
    fil: ["affidavit", "salaysay na may panunumpa"]
  birth certificate:
    en: ["a birth certificate", "birth certificate"]
    fil: ["birth certificate", "sertipiko ng kapanganakan"]
  death certificate:
    en: ["a death certificate", "death certificate"]
    fil: ["death certificate", "sertipiko ng pagkamatay"]
  official receipt:
    en: ["an official receipt", "official receipt"]
    fil: ["official receipt", "opisyal na resibo"]
  application form:
    en: ["an application form", "application form"]
    fil: ["application form", "porma ng aplikasyon"]
  barangay clearance:
    en: ["a barangay clearance", "barangay clearance"]
    fil: ["barangay clearance", "klirans mula sa barangay"]
  police clearance:
    en: ["a police clearance", "police clearance"]
    fil: ["police clearance", "klirans mula sa pulis"]
  medical certificate:
    en: ["a medical certificate", "medical certificate"]
    fil: ["medical certificate", "sertipikong medikal"]

