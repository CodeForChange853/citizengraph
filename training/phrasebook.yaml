# Phrase templates for the synthetic training questions.
#
# Written by us by hand. No LLM API output, and nothing from eval/heldout/ (never read).
# Only questions live here: no answer text from the charters.
#
# NEEDS-NATIVE-REVIEW: every `fil` and `mixed` string in this file (service names, variant
# phrases, connectors, frames and families) is unverified Filipino or Taglish. A native speaker
# must review it (CLAUDE.md rule 8). The full list is in docs/training_notes.md.
#
# Language labels: en = English; fil = predominantly Filipino (nativized loanwords such as
# "permit" or "requirements" are fine); mixed = Taglish, Filipino frame with English clauses.
#
# Syntax: {service} is replaced by a service name; <a|b> picks one alternative (<a|> is optional).
# A family is a list of paraphrases that always travel together into ONE split (train,
# validation or test_synthetic); the dataset is split by family so paraphrases cannot leak.
# Family ids are "<intent>.<shape>.<language>.<index starting at 1>".

version: 1

