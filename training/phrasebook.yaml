# How a variant phrase is attached to a question (the question's final "?" or "." is removed
# first). Shared by all families: they carry no intent wording.
variant_frames:
  en: ["{base} ({variant})", "{base} - {variant}", "{variant}: {base}", "{base}, {variant}"]
  fil: ["{base} ({variant})", "{base} - {variant}", "{variant}: {base}", "{base}, para sa {variant}"]
  mixed: ["{base} ({variant})", "{base} - {variant}", "{variant}: {base}", "{base}, for {variant}"]
variant_joiners:
  en: [" and ", ", "]
  fil: [" at ", ", "]
  mixed: [" and ", " at ", ", "]

