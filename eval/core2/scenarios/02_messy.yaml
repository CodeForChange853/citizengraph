# Messy scenarios: several facts interact. Written AFTER the baseline rules were frozen
# (docs/core2_notes.md section 2). Some exercise a documented baseline simplification, some are
# combinations the baseline handles fine; both are kept on purpose. `gold` is hand-written from
# the injected facts. Scenarios with `check_truth: false` deliberately differ from the simulator's
# single-situation truth because a second fact changes the answer.

- id: M01_absent_signatory_suspension_missing_timestamp
  title: Absent signatory + declared suspension day + an earlier step lost a timestamp
  category: messy
  seed: 201
  as_of: "2026-03-04T14:00"
  max_steps: 12
  notes: The combination named in docs/specs.md section 3. The bad timestamp is in an earlier step, so the current step can still be measured.
  apps:
    - {id: A1, ref: CG-SIM-0201, citizen: CIT-0201, service: business_permit, situation: over_charter, at_step: 8, inject: [role_unavailable, missing_earlier, extra_suspension]}
  task: {kind: status, ref: CG-SIM-0201}
  gold:
    applications:
      A1:
        status: delayed
        alerts: [citizen_delay_notice, department_head_escalation, missing_data_flag]
        reasons: [over_charter_step_time, role_unavailable, missing_timestamp_earlier_step]
  required_tools: [get_applications, get_workflow_state, get_step_sla, get_role_availability, draft_alert]

