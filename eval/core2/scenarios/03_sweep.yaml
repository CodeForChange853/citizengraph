- id: W01_bplo_sweep_mixed
  title: BPLO sweep with overdue, on-time, external and another office's applications
  category: sweep
  seed: 301
  as_of: "2026-03-04T14:00"
  max_steps: 24
  apps:
    - {id: A1, ref: CG-SIM-0301, citizen: CIT-0301, service: business_permit, situation: over_charter, at_step: 8}
    - {id: A2, ref: CG-SIM-0302, citizen: CIT-0302, service: business_permit, situation: on_time, at_step: 8}
    - {id: A3, ref: CG-SIM-0303, citizen: CIT-0303, service: occupational_permit, situation: external_over, at_step: 3}
    - {id: A4, ref: CG-SIM-0304, citizen: CIT-0304, service: business_permit, situation: overdue_statutory, at_step: 8}
    - {id: A5, ref: CG-SIM-0305, citizen: CIT-0305, service: cho_dental_services, situation: over_charter, at_step: 1}
  task: {kind: office_sweep, office_id: bplo}
