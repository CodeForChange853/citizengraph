# Neo4j for local development / the LGU workstation.
# Usage: cp .env.example .env, set NEO4J_PASSWORD, then: docker compose up -d
services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
volumes:
  neo4j_data:
