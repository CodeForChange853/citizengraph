# Greeting and thanks words: a message made only of these (and function words) is not a request.
greetings:
  en: [
    hello, hi, hey, good, morning, afternoon, evening, thanks, thank, ok, okay, bye, goodbye, sir,
    maam, madam, helo, hallo, hai, yo,
  ]
  fil: [salamat, kumusta, kamusta, magandang, umaga, hapon, gabi, po, opo]

# Short typed answers to an echo ("I understood ... Correct?")
confirm_yes:
  en: ["yes", yeah, yep, yup, correct, right, sure, ok, okay, yess, yea, confirm, confirmed, exactly]
  fil: [oo, opo, tama, sige]
confirm_no:
  en: ["no", nope, wrong, incorrect, nah, cancel]
  fil: [hindi, mali, di, hnd]

# Words that join two requests when they sit between two service mentions.
conjunctions:
  en: [and, plus, also, then, or, versus, vs]
  fil: [at, saka, tsaka, atsaka, tapos, pati, o]

# Words left out of an alias' "content tokens" (the words that must all be present for a
# reordered match). Real stop words only; do not add nouns here.
