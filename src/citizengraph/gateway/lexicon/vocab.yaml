  the, a, an, of, for, to, in, "on", at, is, are, am, was, be, do, does, did, i, me, my, we, our,
  you, your, it, its, this, that, with, from, about, by, as, and, or, if, so, ang, ng, sa, mga,
  ay, na, pa, ba, po, opo, para, ko, mo, ka, ako, namin, natin, ito, iyan, yan, yun, nito, o, at,
]

