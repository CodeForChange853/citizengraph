# Intent keywords. Phrases are matched on normalized tokens (lowercase, no punctuation, SMS table
# applied), longest phrase first, and a matched phrase is used up. `weak` phrases are dropped when
# a processing_time phrase sits within 5 words (so "how long is the process" is not also "steps").
# Filipino phrases are DRAFT. NEEDS-NATIVE-REVIEW (every `fil` list below)

