# Alias table for the gateway (src/citizengraph/gateway/). EN and Filipino names and everyday
# phrases for every charter service (40) and the four offices. Editable by LGU staff without
# retraining. The gateway matches citizen text against these, so one phrase listed under several
# targets on purpose makes the gateway ASK which one is meant (for example "birth certificate").
#
# services: one row per charter service.
#   id           graph service id when in_graph is true; the charter ref (e.g. BPLO-03) otherwise
#   in_graph     true: curated in graph/seed. false: held back (docs/seed_status.md, "Excluded");
#                the gateway answers "this service's information is not available yet, please ask
#                <office>" instead of pretending
#   name         charter name, only for services that are not in the graph (the graph has the rest)
#   cues_en/fil  words that pick this service out of several that share a phrase (timely vs delayed)
# aliases: one row per phrase.
#   target       a service id (above) or an office id (bplo, lcro, cho, cswdo)
#   lang         en | fil          (Waray is out of scope)
#   kind         name | synonym | abbreviation | everyday  (match weight 1.00 / 0.97 / 0.95 / 0.93)
#   needs_native_review  on every Filipino row: DRAFT until a native speaker reviews it
# Text is matched after the gateway's normalizer (lowercase, no apostrophes or hyphens).
# NEEDS-NATIVE-REVIEW (every row and cue with lang fil or under cues_fil)
version: 1
