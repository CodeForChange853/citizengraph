title: 15. Petition for Change of First Name or Correction of Clerical Error under RA 9048 & RA 10172
description: |-
  Republic Act 9048 - authorizes the city or municipal civil registrar or the consul general to correct a clerical error or typographical error in an entry and/or change the first name or nickname in the civil register without need of a judicial order.
  Republic Act 10172 - An Act further authorizing the City or Municipal Civil Registrar or the Consul General to correct clerical error or typographical error in the Day and Month of Date of Birth or Sex of a Person appearing in the Civil Register without need of a Judicial Order amending for this purpose Republic Act 9048.
name: PETITION FOR CHANGE OF FIRST NAME OR CORRECTION OF CLERICAL ERROR UNDER RA 9048 & RA 10172
